[project]
name = "video-analyzer"
version = "0.1.0"
description = "Turns car-window video into a Sidequest level file (surfaces, obstacles, speed curve)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "opencv-python>=4.10",
    "imageio-ffmpeg>=0.5",
    "tqdm>=4.66",
]

[project.scripts]
analyze = "video_analyzer.cli:main"

[dependency-groups]
dev = [
    "matplotlib>=3.11.1",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
